<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<title>Storyboard Viewer 2</title>

<style>
body { font-family: sans-serif; background: #eee; padding: 20px; }

.frame {
    margin-bottom: 20px;
    border: 2px solid #333;
    display: inline-block;
    background: white;
    padding: 10px;
}

.half-wrapper {
    width: 600px;
    height: 425px;
    overflow: hidden;
    position: relative;
    margin-bottom: 10px;
    border: 2px solid red;
}

.half-wrapper img {
    width: 100%;
    position: absolute;
    left: 0;
}

.half-wrapper.top img {
    top: 0;
}

.half-wrapper.bottom img {
    top: -425px;
}
</style>
</head>
